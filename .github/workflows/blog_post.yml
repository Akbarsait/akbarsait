name: Latest Blog Post Workflow
on:
  schedule: # Run automatically every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Run manually whenever you want

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Pull in akbarsait.com posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          # Your correct RSS feed URL
          feed_list: "https://akbarsait.com/blog.rss"
          
          # Your specific filename (Capital R)
          readme_path: "Readme.md"
          
          # Show the last 5 posts
          max_post_count: 5
          
          # HTML template to open links in a new tab
          template: '* <a href="$url" target="_blank" rel="noopener noreferrer">$title</a>'
