name: Latest Blog Post Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # DEBUG STEP: This will print the exact file content to the logs
       - name: 🔍 Debug Readme
        run: cat Readme.md
        
      - name: Pull in akbarsait.com posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://akbarsait.com/blog.rss"
          readme_path: "Readme.md"
          max_post_count: 5
          # ADD THIS NEW LINE BELOW:
          template: '<li><a href="$url" target="_blank" rel="noopener noreferrer">$title</a></li>'
