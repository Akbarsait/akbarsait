name: Update Unsplash Photo

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: # Allows you to run it manually to test

permissions:
  contents: write

jobs:
  update-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Random Photo
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # REPLACE 'your-username' BELOW WITH YOUR ACTUAL UNSPLASH USERNAME
          UNSPLASH_USERNAME: akbarsait 
        run: |
          # 1. Get the URL of a random photo from your profile (landscape orientation)
          PHOTO_URL=$(curl -s -H "Authorization: Client-ID $UNSPLASH_ACCESS_KEY" \
            "https://api.unsplash.com/photos/random?username=$UNSPLASH_USERNAME&orientation=landscape" \
            | jq -r '.urls.regular')
          
          echo "Fetching photo from: $PHOTO_URL"
          
          # 2. Download the image and save it as featured-photo.jpg
          curl -s -o featured-photo.jpg "$PHOTO_URL"

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add featured-photo.jpg
          # Only commit if the file has changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update profile photo" && git push)
